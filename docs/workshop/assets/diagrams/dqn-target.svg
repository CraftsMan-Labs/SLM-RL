<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270" role="img" aria-label="Online network vs target network">
<title>Online network vs target network</title>
<rect width="100%" height="100%" fill="#171512"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#D89B55"/>
  </marker>
</defs>
<rect x="80.0" y="40.0" width="220.0" height="64.0" rx="8" fill="#0D0C0B" stroke="#60584E" stroke-width="1.4"/><text x="190.0" y="64.0" text-anchor="middle" fill="#F2E7D5" font-family="Inter, Helvetica, sans-serif" font-size="13" font-weight="600"><tspan x="190.0" dy="0">online net</tspan><tspan x="190.0" dy="16">learns every few steps</tspan></text><rect x="80.0" y="160.0" width="220.0" height="64.0" rx="8" fill="#0D0C0B" stroke="#60584E" stroke-width="1.4"/><text x="190.0" y="184.0" text-anchor="middle" fill="#F2E7D5" font-family="Inter, Helvetica, sans-serif" font-size="13" font-weight="600"><tspan x="190.0" dy="0">target net</tspan><tspan x="190.0" dy="16">copied every 1000 updates</tspan></text><rect x="420.0" y="100.0" width="220.0" height="64.0" rx="8" fill="#0D0C0B" stroke="#60584E" stroke-width="1.4"/><text x="530.0" y="124.0" text-anchor="middle" fill="#F2E7D5" font-family="Inter, Helvetica, sans-serif" font-size="13" font-weight="600"><tspan x="530.0" dy="0">stable target</tspan><tspan x="530.0" dy="16">for the Bellman backup</tspan></text><line x1="300.0" y1="72.0" x2="420.0" y2="120.0" stroke="#D89B55" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="300.0" y1="192.0" x2="420.0" y2="148.0" stroke="#D89B55" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
