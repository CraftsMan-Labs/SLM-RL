<svg xmlns="http://www.w3.org/2000/svg" width="780" height="200" viewBox="0 0 780 200" role="img" aria-label="Experience replay">
<title>Experience replay</title>
<rect width="100%" height="100%" fill="#171512"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#D89B55"/>
  </marker>
</defs>
<rect x="40.0" y="70.0" width="180.0" height="70.0" rx="8" fill="#0D0C0B" stroke="#60584E" stroke-width="1.4"/><text x="130.0" y="97.0" text-anchor="middle" fill="#F2E7D5" font-family="Inter, Helvetica, sans-serif" font-size="13" font-weight="600"><tspan x="130.0" dy="0">play one step</tspan><tspan x="130.0" dy="16">(s, a, r, s&#x27;)</tspan></text><rect x="300.0" y="70.0" width="180.0" height="70.0" rx="8" fill="#0D0C0B" stroke="#60584E" stroke-width="1.4"/><text x="390.0" y="97.0" text-anchor="middle" fill="#F2E7D5" font-family="Inter, Helvetica, sans-serif" font-size="13" font-weight="600"><tspan x="390.0" dy="0">store in replay</tspan><tspan x="390.0" dy="16">buffer</tspan></text><rect x="560.0" y="70.0" width="180.0" height="70.0" rx="8" fill="#0D0C0B" stroke="#60584E" stroke-width="1.4"/><text x="650.0" y="97.0" text-anchor="middle" fill="#F2E7D5" font-family="Inter, Helvetica, sans-serif" font-size="13" font-weight="600"><tspan x="650.0" dy="0">sample a batch</tspan><tspan x="650.0" dy="16">and learn</tspan></text><line x1="220.0" y1="105.0" x2="300.0" y2="105.0" stroke="#D89B55" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="480.0" y1="105.0" x2="560.0" y2="105.0" stroke="#D89B55" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
