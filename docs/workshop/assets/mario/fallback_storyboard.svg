<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Mario DQN fallback storyboard">
  <title>Untrained, mid, and pretrained Mario DQN</title>
  <rect width="100%" height="100%" fill="#171512"/>
  <g font-family="Inter, Helvetica, sans-serif">
    <g>
      <rect x="24" y="36" width="280" height="180" rx="10" fill="#0D0C0B" stroke="#60584E"/>
      <text x="164" y="62" text-anchor="middle" fill="#A98D6B" font-size="12" font-weight="600">UNTRAINED</text>
      <rect x="24" y="168" width="280" height="48" fill="#3a2a16"/>
      <rect x="70" y="150" width="28" height="28" fill="#D89B55"/>
      <rect x="200" y="140" width="36" height="28" fill="#60584E"/>
      <text x="164" y="236" text-anchor="middle" fill="#CFC2AF" font-size="13">Falls in the first pit</text>
    </g>
    <g>
      <rect x="340" y="36" width="280" height="180" rx="10" fill="#0D0C0B" stroke="#60584E"/>
      <text x="480" y="62" text-anchor="middle" fill="#A98D6B" font-size="12" font-weight="600">MID CHECKPOINT</text>
      <rect x="340" y="168" width="280" height="48" fill="#3a2a16"/>
      <rect x="430" y="128" width="28" height="40" fill="#D89B55"/>
      <rect x="520" y="120" width="40" height="48" fill="#60584E"/>
      <text x="480" y="236" text-anchor="middle" fill="#CFC2AF" font-size="13">Holds right, clears a pipe</text>
    </g>
    <g>
      <rect x="656" y="36" width="280" height="180" rx="10" fill="#0D0C0B" stroke="#D89B55"/>
      <text x="796" y="62" text-anchor="middle" fill="#D89B55" font-size="12" font-weight="600">PRETRAINED</text>
      <rect x="656" y="168" width="280" height="48" fill="#3a2a16"/>
      <rect x="780" y="108" width="28" height="28" fill="#D89B55"/>
      <rect x="860" y="128" width="40" height="40" fill="#60584E"/>
      <circle cx="720" cy="156" r="8" fill="#A98D6B"/>
      <text x="796" y="236" text-anchor="middle" fill="#CFC2AF" font-size="13">Distance becomes the score</text>
    </g>
  </g>
</svg>
